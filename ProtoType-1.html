<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Toon Chess 3D - Style B Prototype</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #ffefc1 0%, #ffd166 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      touch-action: none;
    }
    #ui-bar {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      align-items: center;
      background: #ffffff;
      border: 4px solid #1a1a2e;
      border-radius: 999px;
      padding: 8px 20px;
      box-shadow: 0 6px 0 #1a1a2e;
      z-index: 10;
      white-space: nowrap;
    }
    #turn-badge {
      font-weight: 900;
      font-size: 16px;
      color: #1a1a2e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn {
      background: #06d6a0;
      color: #1a1a2e;
      border: 3px solid #1a1a2e;
      border-radius: 999px;
      padding: 6px 14px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 3px 0 #1a1a2e;
      transition: transform 0.1s;
    }
    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 0 0 #1a1a2e;
    }
    #comic-popup {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 54px;
      font-weight: 900;
      color: #ffbe0b;
      -webkit-text-stroke: 3px #1a1a2e;
      text-shadow: 5px 5px 0 #ef476f;
      pointer-events: none;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 20;
    }
    #hint {
      position: absolute;
      bottom: 14px;
      width: 100%;
      text-align: center;
      font-weight: 700;
      font-size: 13px;
      color: #1a1a2e;
      pointer-events: none;
    }
  </style>
  <!-- Load Three.js, OrbitControls, and Chess.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>

  <div id="ui-bar">
    <span id="turn-badge">🟢 Your Turn (Mint)</span>
    <button class="btn" id="cam-btn">2D / 3D View</button>
    <button class="btn" id="reset-btn" style="background:#ffbe0b;">New Game</button>
  </div>
  <div id="comic-popup">POW!</div>
  <div id="hint">Tap a piece to bounce & move • Drag to spin camera</div>

  <script>
    // --- 1. SCENE, CAMERA & RENDERER ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 11, 10.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2.15;
    controls.minDistance = 6;
    controls.maxDistance = 22;

    // --- 2. CEL-SHADING LIGHTING & TOON GRADIENT ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(8, 16, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    // Create 3-tone crisp step texture for Cel Shading
    const toonData = new Uint8Array([90, 180, 255]);
    const gradientMap = new THREE.DataTexture(toonData, 3, 1, THREE.LuminanceFormat);
    gradientMap.minFilter = THREE.NearestFilter;
    gradientMap.magFilter = THREE.NearestFilter;
    gradientMap.needsUpdate = true;

    const outlineMat = new THREE.MeshBasicMaterial({ color: 0x1a1a2e, side: THREE.BackSide });

    function makeToonMat(hexColor) {
      return new THREE.MeshToonMaterial({ color: hexColor, gradientMap: gradientMap });
    }

    // Helper: Add bold comic black outline to any mesh
    function addComicOutline(mesh, thickness = 1.07) {
      const outline = new THREE.Mesh(mesh.geometry, outlineMat);
      outline.scale.set(thickness, thickness, thickness);
      mesh.add(outline);
    }

    // --- 3. BUILD THE COMIC CHESSBOARD ---
    const boardGroup = new THREE.Group();
    scene.add(boardGroup);

    const tileMeshes = {};
    const lightTileMat = makeToonMat(0xfff8e7); // Warm Cream
    const darkTileMat = makeToonMat(0x7b6cf6);  // Comic Lavender-Indigo

    // Chunky Outer Frame
    const frameGeo = new THREE.BoxGeometry(9.0, 0.5, 9.0);
    const frameMesh = new THREE.Mesh(frameGeo, makeToonMat(0x1a1a2e));
    frameMesh.position.y = -0.3;
    frameMesh.receiveShadow = true;
    boardGroup.add(frameMesh);

    const files = ['a','b','c','d','e','f','g','h'];
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const sqName = files[c] + (8 - r);
        const isLight = (r + c) % 2 === 0;
        const geo = new THREE.BoxGeometry(0.96, 0.25, 0.96);
        const tile = new THREE.Mesh(geo, isLight ? lightTileMat : darkTileMat);
        tile.position.set(c - 3.5, 0, r - 3.5);
        tile.receiveShadow = true;
        tile.userData = { square: sqName };
        boardGroup.add(tile);
        tileMeshes[sqName] = tile;
      }
    }

    // --- 4. SCULPT CEL-SHADED CARTOON PIECES ---
    const whiteMat = makeToonMat(0x06d6a0); // Vibrant Mint Cyan
    const blackMat = makeToonMat(0xef476f); // Hot Coral Pink
    const crownMat = makeToonMat(0xffbe0b); // Comic Gold

    function createCartoonPiece(type, color) {
      const group = new THREE.Group();
      const mat = color === 'w' ? whiteMat : blackMat;

      // Chunky Base
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.42, 0.22, 20), mat);
      base.position.y = 0.11;
      base.castShadow = true;
      addComicOutline(base, 1.08);
      group.add(base);

      if (type === 'p') {
        const body = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.5, 20), mat);
        body.position.y = 0.4;
        addComicOutline(body, 1.08);
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 20, 20), mat);
        head.position.y = 0.72;
        head.castShadow = true;
        addComicOutline(head, 1.09);
        group.add(body, head);
      } else if (type === 'r') {
        const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.34, 0.75, 16), mat);
        tower.position.y = 0.52;
        tower.castShadow = true;
        addComicOutline(tower, 1.08);
        group.add(tower);
      } else if (type === 'n') {
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.32, 0.6, 16), mat);
        body.position.y = 0.45;
        addComicOutline(body, 1.08);
        const snout = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.36, 0.52), mat);
        snout.position.set(0, 0.82, color === 'w' ? -0.1 : 0.1);
        snout.castShadow = true;
        addComicOutline(snout, 1.08);
        group.add(body, snout);
      } else if (type === 'b') {
        const body = new THREE.Mesh(new THREE.ConeGeometry(0.32, 0.85, 20), mat);
        body.position.y = 0.58;
        addComicOutline(body, 1.08);
        const orb = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 12), crownMat);
        orb.position.y = 1.05;
        addComicOutline(orb, 1.12);
        group.add(body, orb);
      } else if (type === 'q' || type === 'k') {
        const height = type === 'k' ? 0.95 : 0.85;
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.35, height, 20), mat);
        body.position.y = height / 2 + 0.15;
        addComicOutline(body, 1.08);
        const crown = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.08, 12, 20), crownMat);
        crown.rotation.x = Math.PI / 2;
        crown.position.y = height + 0.18;
        addComicOutline(crown, 1.1);
        group.add(body, crown);
        if (type === 'k') {
          const gem = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.32, 0.16), crownMat);
          gem.position.y = height + 0.38;
          addComicOutline(gem, 1.12);
          group.add(gem);
        }
      }
      return group;
    }

    // --- 5. CHESS LOGIC, HIGHLIGHTS & JUICY ANIMATIONS ---
    const game = new Chess();
    const pieceMeshes = {};
    const highlightMeshes = [];
    const flyingDebris = [];
    const activeJumpers = [];
    let selectedSquare = null;
    let isAnimating = false;

    function squareToPos(sq) {
      const c = files.indexOf(sq[0]);
      const r = 8 - parseInt(sq[1]);
      return new THREE.Vector3(c - 3.5, 0.13, r - 3.5);
    }

    function syncBoard() {
      Object.values(pieceMeshes).forEach(m => scene.remove(m));
      for (let k in pieceMeshes) delete pieceMeshes[k];

      const board = game.board();
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = board[r][c];
          if (p) {
            const sq = files[c] + (8 - r);
            const mesh = createCartoonPiece(p.type, p.color);
            mesh.position.copy(squareToPos(sq));
            mesh.userData = { square: sq, color: p.color };
            scene.add(mesh);
            pieceMeshes[sq] = mesh;
          }
        }
      }
    }
    syncBoard();

    function clearHighlights() {
      highlightMeshes.forEach(m => scene.remove(m));
      highlightMeshes.length = 0;
    }

    function showValidMoves(sq) {
      clearHighlights();
      const moves = game.moves({ square: sq, verbose: true });
      moves.forEach(m => {
        const isCapture = m.captured;
        const ringGeo = new THREE.RingGeometry(0.22, 0.38, 24);
        const ringMat = new THREE.MeshBasicMaterial({
          color: isCapture ? 0xff0055 : 0xffbe0b,
          side: THREE.DoubleSide
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = -Math.PI / 2;
        const pos = squareToPos(m.to);
        ring.position.set(pos.x, 0.15, pos.z);
        ring.userData = { targetSquare: m.to };
        scene.add(ring);
        highlightMeshes.push(ring);
      });
    }

    function showComicPopup(text) {
      const el = document.getElementById('comic-popup');
      el.innerText = text;
      el.style.transform = 'translate(-50%, -50%) scale(1.1) rotate(-8deg)';
      setTimeout(() => { el.style.transform = 'translate(-50%, -50%) scale(0)'; }, 650);
    }

    // Perform Bouncy Parabolic Hop + Knock-off Capture
    function animateMove(fromSq, toSq, onComplete) {
      isAnimating = true;
      const mover = pieceMeshes[fromSq];
      const captured = pieceMeshes[toSq];
      const startPos = mover.position.clone();
      const endPos = squareToPos(toSq);

      activeJumpers.push({
        mesh: mover,
        startPos,
        endPos,
        progress: 0,
        capturedMesh: captured,
        hasTriggeredCapture: false,
        onComplete
      });
    }

    function executeMove(fromSq, toSq) {
      const moveObj = game.move({ from: fromSq, to: toSq, promotion: 'q' });
      if (!moveObj) return;

      clearHighlights();
      selectedSquare = null;

      animateMove(fromSq, toSq, () => {
        delete pieceMeshes[fromSq];
        pieceMeshes[toSq] = pieceMeshes[toSq]; // Handled via sync
        syncBoard();
        isAnimating = false;
        updateTurnUI();

        // Trigger AI Move if it's Black's turn
        if (!game.game_over() && game.turn() === 'b') {
          setTimeout(makeAIMove, 350);
        }
      });
    }

    function makeAIMove() {
      const moves = game.moves({ verbose: true });
      if (moves.length === 0) return;
      // Prefer captures for extra comic fun!
      const captures = moves.filter(m => m.captured);
      const chosen = captures.length > 0
        ? captures[Math.floor(Math.random() * captures.length)]
        : moves[Math.floor(Math.random() * moves.length)];
      executeMove(chosen.from, chosen.to);
    }

    function updateTurnUI() {
      const badge = document.getElementById('turn-badge');
      if (game.in_checkmate()) {
        badge.innerText = '💥 CHECKMATE!';
        showComicPopup('CHECKMATE!');
      } else if (game.in_check()) {
        badge.innerText = '⚠️ CHECK!';
        showComicPopup('CHECK!');
      } else {
        badge.innerText = game.turn() === 'w' ? '🟢 Your Turn (Mint)' : '🌸 AI Thinking...';
      }
    }

    // --- 6. TOUCH & CLICK RAYCASTING ---
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    window.addEventListener('pointerdown', (e) => {
      if (isAnimating || game.turn() !== 'w' || e.target.tagName === 'BUTTON') return;

      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      const hits = raycaster.intersectObjects(boardGroup.children);
      if (hits.length > 0) {
        const clickedSq = hits[0].object.userData.square;
        if (!clickedSq) return;

        // Did user tap a valid destination square?
        if (selectedSquare) {
          const valid = game.moves({ square: selectedSquare, verbose: true }).some(m => m.to === clickedSq);
          if (valid) {
            executeMove(selectedSquare, clickedSq);
            return;
          }
        }

        // Did user tap one of their own pieces?
        const piece = game.get(clickedSq);
        if (piece && piece.color === 'w') {
          // Reset old selected piece height
          if (selectedSquare && pieceMeshes[selectedSquare]) {
            pieceMeshes[selectedSquare].position.y = 0.13;
            pieceMeshes[selectedSquare].scale.set(1, 1, 1);
          }
          selectedSquare = clickedSq;
          showValidMoves(clickedSq);
        } else {
          if (selectedSquare && pieceMeshes[selectedSquare]) {
            pieceMeshes[selectedSquare].position.y = 0.13;
          }
          selectedSquare = null;
          clearHighlights();
        }
      }
    });

    // --- 7. UI BUTTONS ---
    let isTopDown = false;
    document.getElementById('cam-btn').addEventListener('click', () => {
      isTopDown = !isTopDown;
      if (isTopDown) {
        camera.position.set(0, 15, 0.01);
      } else {
        camera.position.set(0, 11, 10.5);
      }
      controls.update();
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      game.reset();
      clearHighlights();
      selectedSquare = null;
      syncBoard();
      updateTurnUI();
    });

    // --- 8. ANIMATION LOOP (BOUNCE, SQUASH & KNOCK-OFF) ---
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();

      // Selected piece bouncy hover
      if (selectedSquare && pieceMeshes[selectedSquare] && !isAnimating) {
        const m = pieceMeshes[selectedSquare];
        m.position.y = 0.55 + Math.sin(elapsed * 8) * 0.12;
        m.rotation.y = Math.sin(elapsed * 4) * 0.2;
      }

      // Pulse valid move rings
      highlightMeshes.forEach(r => {
        const s = 1 + Math.sin(elapsed * 6) * 0.12;
        r.scale.set(s, s, 1);
      });

      // Parabolic Hop + Squash & Stretch
      for (let i = activeJumpers.length - 1; i >= 0; i--) {
        const j = activeJumpers[i];
        j.progress += dt * 3.2; // Jump speed
        const t = Math.min(j.progress, 1);

        // Horizontal lerp + vertical parabolic arc
        j.mesh.position.lerpVectors(j.startPos, j.endPos, t);
        j.mesh.position.y = 0.13 + Math.sin(t * Math.PI) * 1.9;

        // Cartoon Squash & Stretch during flight
        const stretch = 1 + Math.sin(t * Math.PI) * 0.25;
        j.mesh.scale.set(1 / Math.sqrt(stretch), stretch, 1 / Math.sqrt(stretch));

        // Trigger Comic Capture Knock-off right before landing
        if (t > 0.75 && j.capturedMesh && !j.hasTriggeredCapture) {
          j.hasTriggeredCapture = true;
          const words = ['POW!', 'BAM!', 'BONK!', 'SMASH!'];
          showComicPopup(words[Math.floor(Math.random() * words.length)]);
          flyingDebris.push({
            mesh: j.capturedMesh,
            vel: new THREE.Vector3((Math.random() - 0.5) * 8, 9, (Math.random() - 0.5) * 8),
            rot: new THREE.Vector3(12, 8, 10)
          });
        }

        if (t >= 1) {
          j.mesh.scale.set(1, 1, 1);
          activeJumpers.splice(i, 1);
          j.onComplete();
        }
      }

      // Update knocked-off captured pieces flying through the air
      for (let i = flyingDebris.length - 1; i >= 0; i--) {
        const d = flyingDebris[i];
        d.mesh.position.addScaledVector(d.vel, dt);
        d.vel.y -= 25 * dt; // Gravity
        d.mesh.rotation.x += d.rot.x * dt;
        d.mesh.rotation.z += d.rot.z * dt;
        if (d.mesh.position.y < -8) {
          scene.remove(d.mesh);
          flyingDebris.splice(i, 1);
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
