<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Toon Chess 3D - v4 Arcade Edition</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #fff3c4 0%, #ffca58 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      touch-action: none;
    }
    #ui-bar {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      align-items: center;
      background: #ffffff;
      border: 4px solid #1a1a2e;
      border-radius: 999px;
      padding: 7px 14px;
      box-shadow: 0 6px 0 #1a1a2e;
      z-index: 10;
      white-space: nowrap;
      max-width: 96vw;
    }
    #turn-badge {
      font-weight: 900;
      font-size: 14px;
      color: #1a1a2e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0 6px;
    }
    .btn {
      background: #06d6a0;
      color: #1a1a2e;
      border: 3px solid #1a1a2e;
      border-radius: 999px;
      padding: 6px 12px;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 3px 0 #1a1a2e;
      transition: transform 0.1s;
    }
    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 0 0 #1a1a2e;
    }
    /* Arcade Setup Modal */
    #team-modal {
      position: fixed;
      inset: 0;
      background: rgba(26, 26, 46, 0.7);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal-card {
      background: #ffffff;
      border: 5px solid #1a1a2e;
      border-radius: 28px;
      padding: 24px 26px;
      text-align: center;
      box-shadow: 0 10px 0 #1a1a2e;
      max-width: 92vw;
      width: 410px;
    }
    .modal-title {
      margin: 0 0 4px 0;
      font-size: 26px;
      font-weight: 900;
      color: #1a1a2e;
      text-transform: uppercase;
    }
    .section-label {
      margin: 14px 0 8px 0;
      font-size: 12px;
      font-weight: 900;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .pill-row {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .pill-btn {
      flex: 1;
      border: 3px solid #1a1a2e;
      border-radius: 14px;
      padding: 9px 6px;
      font-weight: 900;
      font-size: 13px;
      background: #f4f4f8;
      color: #1a1a2e;
      cursor: pointer;
      box-shadow: 0 4px 0 #1a1a2e;
      transition: all 0.1s;
    }
    .pill-btn.active {
      background: #ffbe0b;
      transform: translateY(2px);
      box-shadow: 0 2px 0 #1a1a2e;
    }
    .team-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }
    .team-choice {
      border: 4px solid #1a1a2e;
      border-radius: 20px;
      padding: 15px 10px;
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 6px 0 #1a1a2e;
      transition: transform 0.12s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .team-choice:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #1a1a2e;
    }
    .team-mint { background: #06d6a0; color: #1a1a2e; }
    .team-neon { background: #ef476f; color: #ffffff; }
    .team-tag {
      font-size: 11px;
      font-weight: 800;
      background: rgba(26, 26, 46, 0.2);
      padding: 3px 8px;
      border-radius: 99px;
    }
    #comic-popup {
      position: absolute;
      top: 32%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 56px;
      font-weight: 900;
      color: #ffbe0b;
      -webkit-text-stroke: 3px #1a1a2e;
      text-shadow: 5px 5px 0 #ef476f;
      pointer-events: none;
      transition: transform 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 20;
    }
    #hint {
      position: absolute;
      bottom: 14px;
      width: 100%;
      text-align: center;
      font-weight: 800;
      font-size: 13px;
      color: #1a1a2e;
      pointer-events: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>

  <!-- Top Bar -->
  <div id="ui-bar">
    <span id="turn-badge">🟢 Mint's Turn</span>
    <button class="btn" id="cam-btn">2D / 3D</button>
    <button class="btn" id="sfx-btn" style="background:#a8dadc;">🔊 SFX</button>
    <button class="btn" id="reset-btn" style="background:#ffbe0b;">⚙️ Menu</button>
  </div>

  <!-- Arcade Game Setup Modal -->
  <div id="team-modal">
    <div class="modal-card">
      <h2 class="modal-title">⚡ Toon Chess 3D</h2>

      <div class="section-label">1. Select Game Mode</div>
      <div class="pill-row">
        <button class="pill-btn active" id="mode-ai" onclick="setMode('ai')">🤖 Vs AI</button>
        <button class="pill-btn" id="mode-2p" onclick="setMode('2p')">👥 2P Pass & Play</button>
      </div>

      <div id="diff-section">
        <div class="section-label">2. AI Difficulty</div>
        <div class="pill-row">
          <button class="pill-btn" id="diff-easy" onclick="setDiff('easy')">🌱 Easy</button>
          <button class="pill-btn active" id="diff-med" onclick="setDiff('medium')">⚔️ Medium</button>
          <button class="pill-btn" id="diff-hard" onclick="setDiff('hard')">🔥 Hard</button>
        </div>
      </div>

      <div class="section-label" id="start-label">3. Pick Your Squad to Start!</div>
      <div class="team-grid">
        <button class="team-choice team-mint" onclick="startNewGame('w')">
          <span style="font-size:30px;">🟢</span>
          <span>MINT</span>
          <span class="team-tag">Moves 1st</span>
        </button>
        <button class="team-choice team-neon" onclick="startNewGame('b')">
          <span style="font-size:30px;">🌸</span>
          <span>NEON</span>
          <span class="team-tag">Moves 2nd</span>
        </button>
      </div>
    </div>
  </div>

  <div id="comic-popup">POW!</div>
  <div id="hint">Tap your piece to bounce & move • Drag anywhere to spin camera</div>

  <script>
    // --- 0. ZERO-FILE CARTOON SOUND SYNTHESIZER (WEB AUDIO API) ---
    let audioCtx = null;
    let sfxEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playCartoonSFX(type) {
      if (!sfxEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;

      if (type === 'select') {
        // Bubbly cartoon pop
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(680, now + 0.09);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.09);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.09);
      } else if (type === 'jump') {
        // Springy cartoon "boing"
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(190, now);
        osc.frequency.exponentialRampToValueAtTime(520, now + 0.22);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.24);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.24);
      } else if (type === 'land') {
        // Soft thump
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(55, now + 0.08);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.08);
      } else if (type === 'pow') {
        // Comic book "POW!" impact + noise burst
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.exponentialRampToValueAtTime(45, now + 0.28);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.28);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.28);
      } else if (type === 'check') {
        // Alert two-tone horn
        [440, 587.33].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, now + idx * 0.11);
          gain.gain.setValueAtTime(0.14, now + idx * 0.11);
          gain.gain.linearRampToValueAtTime(0.01, now + idx * 0.11 + 0.14);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.11); osc.stop(now + idx * 0.11 + 0.14);
        });
      } else if (type === 'win') {
        // Arcade victory fanfare
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.12);
          gain.gain.setValueAtTime(0.22, now + idx * 0.12);
          gain.gain.linearRampToValueAtTime(0.01, now + idx * 0.12 + 0.28);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.12); osc.stop(now + idx * 0.12 + 0.28);
        });
      }
    }

    // --- 1. SCENE, CAMERA & RENDERER ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 11.5, 10.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.maxPolarAngle = Math.PI / 2.2;
    controls.minDistance = 7;
    controls.maxDistance = 22;
    controls.target.set(0, 0, 0);

    // --- 2. GLITCH-FREE CEL SHADING & LIGHTING ---
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0xffd166, 0.65);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
    dirLight.position.set(7, 15, 9);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 35;
    const d = 6.5;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    dirLight.shadow.bias = -0.0015;
    scene.add(dirLight);

    const gradCanvas = document.createElement('canvas');
    gradCanvas.width = 4;
    gradCanvas.height = 1;
    const ctx = gradCanvas.getContext('2d');
    ctx.fillStyle = '#666666'; ctx.fillRect(0, 0, 1, 1);
    ctx.fillStyle = '#b0b0b0'; ctx.fillRect(1, 0, 1, 1);
    ctx.fillStyle = '#e8e8e8'; ctx.fillRect(2, 0, 1, 1);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(3, 0, 1, 1);
    const gradientMap = new THREE.CanvasTexture(gradCanvas);
    gradientMap.minFilter = THREE.NearestFilter;
    gradientMap.magFilter = THREE.NearestFilter;

    function makeToonMat(hexColor) {
      return new THREE.MeshToonMaterial({ color: hexColor, gradientMap: gradientMap });
    }

    const outlineMat = new THREE.MeshBasicMaterial({
      color: 0x1a1a2e,
      side: THREE.BackSide,
      polygonOffset: true,
      polygonOffsetFactor: 2,
      polygonOffsetUnits: 2
    });

    function addPart(parent, geo, mat, yPos, zPos = 0, rotX = 0) {
      geo.computeBoundingBox();
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(0, yPos, zPos);
      mesh.rotation.x = rotX;
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      const outline = new THREE.Mesh(geo, outlineMat);
      outline.scale.set(1.07, 1.07, 1.07);
      outline.raycast = () => {};
      mesh.add(outline);

      parent.add(mesh);
      return mesh;
    }

    // --- 3. BUILD THE COMIC CHESSBOARD ---
    const boardGroup = new THREE.Group();
    scene.add(boardGroup);

    const interactables = [];
    const tileMeshes = {};
    const lightTileMat = makeToonMat(0xfff8e7);
    const darkTileMat = makeToonMat(0x7b6cf6);
    const selectedTileMat = makeToonMat(0xffbe0b);

    const borderGeo = new THREE.BoxGeometry(8.9, 0.45, 8.9);
    const borderMesh = new THREE.Mesh(borderGeo, makeToonMat(0x1a1a2e));
    borderMesh.position.y = -0.26;
    borderMesh.receiveShadow = true;
    boardGroup.add(borderMesh);

    const files = ['a','b','c','d','e','f','g','h'];
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const sqName = files[c] + (8 - r);
        const isLight = (r + c) % 2 === 0;
        const baseMat = isLight ? lightTileMat : darkTileMat;
        const tile = new THREE.Mesh(new THREE.BoxGeometry(0.96, 0.24, 0.96), baseMat);
        tile.position.set(c - 3.5, 0, r - 3.5);
        tile.receiveShadow = true;
        tile.userData = { square: sqName, baseMat: baseMat };
        boardGroup.add(tile);
        tileMeshes[sqName] = tile;
        interactables.push(tile);
      }
    }

    // --- 4. SCULPT CLEAN CARTOON PIECES ---
    const whiteMat = makeToonMat(0x06d6a0); // Mint
    const blackMat = makeToonMat(0xef476f); // Neon Coral Pink
    const goldMat  = makeToonMat(0xffbe0b); // Gold Crown
    const eyeWhiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const pupilMat = new THREE.MeshBasicMaterial({ color: 0x1a1a2e });

    function addCuteEyes(group, y, z, dir) {
      [-0.09, 0.09].forEach(xOffset => {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 10), eyeWhiteMat);
        eye.position.set(xOffset, y, z * dir);
        const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.032, 8, 8), pupilMat);
        pupil.position.set(0, 0, 0.035 * dir);
        eye.add(pupil);
        group.add(eye);
      });
    }

    function createCartoonPiece(type, color) {
      const group = new THREE.Group();
      const mat = color === 'w' ? whiteMat : blackMat;
      const dir = color === 'w' ? -1 : 1;

      addPart(group, new THREE.CylinderGeometry(0.35, 0.41, 0.2, 24), mat, 0.1);

      if (type === 'p') {
        addPart(group, new THREE.CylinderGeometry(0.2, 0.32, 0.38, 24), mat, 0.35);
        addPart(group, new THREE.SphereGeometry(0.25, 24, 24), mat, 0.68);
        addCuteEyes(group, 0.7, 0.21, dir);
      } else if (type === 'r') {
        addPart(group, new THREE.CylinderGeometry(0.3, 0.34, 0.58, 20), mat, 0.45);
        addPart(group, new THREE.CylinderGeometry(0.35, 0.3, 0.22, 12), mat, 0.82);
        addCuteEyes(group, 0.55, 0.29, dir);
      } else if (type === 'n') {
        addPart(group, new THREE.CylinderGeometry(0.24, 0.33, 0.52, 20), mat, 0.42);
        addPart(group, new THREE.SphereGeometry(0.26, 20, 20), mat, 0.78);
        addPart(group, new THREE.CylinderGeometry(0.14, 0.2, 0.28, 16), mat, 0.76, 0.22 * dir, Math.PI / 2);
        addCuteEyes(group, 0.85, 0.21, dir);
      } else if (type === 'b') {
        addPart(group, new THREE.CylinderGeometry(0.18, 0.33, 0.55, 24), mat, 0.44);
        addPart(group, new THREE.SphereGeometry(0.24, 24, 24), mat, 0.78);
        addPart(group, new THREE.SphereGeometry(0.1, 16, 16), goldMat, 1.07);
        addCuteEyes(group, 0.8, 0.21, dir);
      } else if (type === 'q') {
        addPart(group, new THREE.CylinderGeometry(0.22, 0.35, 0.68, 24), mat, 0.5);
        addPart(group, new THREE.SphereGeometry(0.25, 24, 24), mat, 0.9);
        addPart(group, new THREE.TorusGeometry(0.18, 0.06, 12, 24), goldMat, 1.12, 0, Math.PI / 2);
        addCuteEyes(group, 0.92, 0.22, dir);
      } else if (type === 'k') {
        addPart(group, new THREE.CylinderGeometry(0.24, 0.36, 0.74, 24), mat, 0.52);
        addPart(group, new THREE.SphereGeometry(0.26, 24, 24), mat, 0.96);
        addPart(group, new THREE.TorusGeometry(0.2, 0.065, 12, 24), goldMat, 1.18, 0, Math.PI / 2);
        addPart(group, new THREE.SphereGeometry(0.12, 16, 16), goldMat, 1.32);
        addCuteEyes(group, 0.98, 0.23, dir);
      }

      return group;
    }

    // --- 5. GAME STATE, MODES, AI DIFFICULTY & CAMERA GLIDE ---
    const game = new Chess();
    const pieceMeshes = {};
    const highlightMeshes = [];
    const flyingDebris = [];
    const activeJumpers = [];
    const particles = [];

    let gameMode = 'ai';       // 'ai' or '2p'
    let aiDifficulty = 'medium'; // 'easy', 'medium', 'hard'
    let playerColor = 'w';     // 'w' = Mint, 'b' = Neon
    let selectedSquare = null;
    let isAnimating = false;
    let isTopDown = false;
    let aiTimeout = null;
    let desiredCamPos = null;  // Used for smooth 180-degree camera orbit in 2P mode

    window.setMode = function(mode) {
      gameMode = mode;
      document.getElementById('mode-ai').classList.toggle('active', mode === 'ai');
      document.getElementById('mode-2p').classList.toggle('active', mode === '2p');
      document.getElementById('diff-section').style.display = mode === 'ai' ? 'block' : 'none';
      document.getElementById('start-label').innerText = mode === 'ai'
        ? '3. Pick Your Squad to Start!'
        : '2. Tap Either Squad to Start 2P Match!';
    };

    window.setDiff = function(diff) {
      aiDifficulty = diff;
      document.getElementById('diff-easy').classList.toggle('active', diff === 'easy');
      document.getElementById('diff-med').classList.toggle('active', diff === 'medium');
      document.getElementById('diff-hard').classList.toggle('active', diff === 'hard');
    };

    function squareToPos(sq) {
      const c = files.indexOf(sq[0]);
      const r = 8 - parseInt(sq[1]);
      return new THREE.Vector3(c - 3.5, 0.12, r - 3.5);
    }

    function assignSquareToPiece(meshGroup, sq, color, type) {
      meshGroup.userData = { square: sq, color: color, type: type };
      meshGroup.traverse(child => {
        if (child.isMesh) child.userData.square = sq;
      });
    }

    function initBoardPieces() {
      Object.values(pieceMeshes).forEach(m => scene.remove(m));
      for (let k in pieceMeshes) delete pieceMeshes[k];

      const board = game.board();
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = board[r][c];
          if (p) {
            const sq = files[c] + (8 - r);
            const mesh = createCartoonPiece(p.type, p.color);
            mesh.position.copy(squareToPos(sq));
            assignSquareToPiece(mesh, sq, p.color, p.type);
            scene.add(mesh);
            pieceMeshes[sq] = mesh;
          }
        }
      }
    }
    initBoardPieces();

    function positionCameraForSide(sideColor, smooth = false) {
      const zSide = sideColor === 'w' ? 1 : -1;
      const targetVec = isTopDown
        ? new THREE.Vector3(0, 15.5, 0.01 * zSide)
        : new THREE.Vector3(0, 11.5, 10.5 * zSide);

      if (smooth) {
        desiredCamPos = targetVec;
      } else {
        desiredCamPos = null;
        camera.position.copy(targetVec);
        controls.target.set(0, 0, 0);
        controls.update();
      }
    }

    window.startNewGame = function(chosenColor) {
      initAudio();
      playCartoonSFX('select');
      if (aiTimeout) clearTimeout(aiTimeout);
      playerColor = chosenColor;
      document.getElementById('team-modal').style.display = 'none';

      game.reset();
      clearSelectionAndHighlights();
      activeJumpers.length = 0;
      isAnimating = false;
      isTopDown = false;

      initBoardPieces();
      const initialViewSide = gameMode === '2p' ? 'w' : playerColor;
      positionCameraForSide(initialViewSide, false);
      updateTurnUI();

      if (gameMode === 'ai' && playerColor === 'b') {
        aiTimeout = setTimeout(makeAIMove, 650);
      }
    };

    function clearSelectionAndHighlights() {
      if (selectedSquare) {
        if (tileMeshes[selectedSquare]) {
          tileMeshes[selectedSquare].material = tileMeshes[selectedSquare].userData.baseMat;
        }
        if (pieceMeshes[selectedSquare]) {
          pieceMeshes[selectedSquare].position.y = 0.12;
          pieceMeshes[selectedSquare].rotation.y = 0;
          pieceMeshes[selectedSquare].scale.set(1, 1, 1);
        }
      }
      selectedSquare = null;
      highlightMeshes.forEach(m => scene.remove(m));
      highlightMeshes.length = 0;
    }

    function selectPieceOnSquare(sq) {
      clearSelectionAndHighlights();
      playCartoonSFX('select');
      selectedSquare = sq;
      tileMeshes[sq].material = selectedTileMat;

      const moves = game.moves({ square: sq, verbose: true });
      moves.forEach(m => {
        const isCapture = m.captured || m.flags.includes('e');
        const geo = new THREE.CylinderGeometry(0.32, 0.32, 0.06, 24);
        const mat = new THREE.MeshBasicMaterial({
          color: isCapture ? 0xff0055 : 0xffbe0b
        });
        const disc = new THREE.Mesh(geo, mat);
        const pos = squareToPos(m.to);
        disc.position.set(pos.x, 0.15, pos.z);
        disc.userData = { square: m.to };
        scene.add(disc);
        highlightMeshes.push(disc);
      });
    }

    function spawnBurstParticles(pos) {
      const colors = [0xffbe0b, 0xef476f, 0x06d6a0, 0xffffff];
      for (let i = 0; i < 14; i++) {
        const p = new THREE.Mesh(
          new THREE.SphereGeometry(0.1, 8, 8),
          new THREE.MeshBasicMaterial({ color: colors[i % colors.length] })
        );
        p.position.copy(pos).add(new THREE.Vector3(0, 0.5, 0));
        scene.add(p);
        particles.push({
          mesh: p,
          vel: new THREE.Vector3((Math.random() - 0.5) * 7, 3 + Math.random() * 5, (Math.random() - 0.5) * 7),
          life: 1.0
        });
      }
    }

    function showComicPopup(text) {
      const el = document.getElementById('comic-popup');
      el.innerText = text;
      el.style.transform = 'translate(-50%, -50%) scale(1.1) rotate(-7deg)';
      setTimeout(() => { el.style.transform = 'translate(-50%, -50%) scale(0)'; }, 700);
    }

    function executeMove(fromSq, toSq) {
      const moveObj = game.move({ from: fromSq, to: toSq, promotion: 'q' });
      if (!moveObj) return;

      clearSelectionAndHighlights();
      isAnimating = true;
      playCartoonSFX('jump');

      const mover = pieceMeshes[fromSq];
      delete pieceMeshes[fromSq];

      let capturedSq = toSq;
      if (moveObj.flags.includes('e')) {
        capturedSq = toSq[0] + fromSq[1];
      }
      const capturedMesh = pieceMeshes[capturedSq];
      if (capturedMesh) {
        delete pieceMeshes[capturedSq];
      }

      if (moveObj.flags.includes('k') || moveObj.flags.includes('q')) {
        const rank = toSq[1];
        const rookFrom = moveObj.flags.includes('k') ? 'h' + rank : 'a' + rank;
        const rookTo   = moveObj.flags.includes('k') ? 'f' + rank : 'd' + rank;
        const rookMesh = pieceMeshes[rookFrom];
        if (rookMesh) {
          delete pieceMeshes[rookFrom];
          pieceMeshes[rookTo] = rookMesh;
          assignSquareToPiece(rookMesh, rookTo, moveObj.color, 'r');
          rookMesh.position.copy(squareToPos(rookTo));
        }
      }

      const startPos = mover.position.clone();
      const endPos = squareToPos(toSq);

      activeJumpers.push({
        mesh: mover,
        startPos,
        endPos,
        progress: 0,
        capturedMesh,
        hasTriggeredCapture: false,
        onComplete: () => {
          playCartoonSFX('land');
          if (moveObj.flags.includes('p')) {
            scene.remove(mover);
            const newQueen = createCartoonPiece('q', moveObj.color);
            newQueen.position.copy(endPos);
            assignSquareToPiece(newQueen, toSq, moveObj.color, 'q');
            scene.add(newQueen);
            pieceMeshes[toSq] = newQueen;
            showComicPopup('PROMOTED!');
          } else {
            pieceMeshes[toSq] = mover;
            assignSquareToPiece(mover, toSq, moveObj.color, moveObj.piece);
          }

          isAnimating = false;
          updateTurnUI();

          if (!game.game_over()) {
            if (gameMode === '2p') {
              // Smoothly rotate camera to the next player's side in 2P mode!
              positionCameraForSide(game.turn(), true);
            } else if (game.turn() !== playerColor) {
              aiTimeout = setTimeout(makeAIMove, 420);
            }
          }
        }
      });
    }

    // --- SMART AI ENGINE (EASY / MEDIUM / HARD) ---
    const pieceWeights = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 900 };

    function evaluateBoard(aiColor) {
      let score = 0;
      const board = game.board();
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = board[r][c];
          if (p) {
            // Bonus for controlling center squares
            const centerBonus = (r >= 2 && r <= 5 && c >= 2 && c <= 5) ? 2 : 0;
            const val = pieceWeights[p.type] + centerBonus;
            score += (p.color === aiColor) ? val : -val;
          }
        }
      }
      return score;
    }

    function makeAIMove() {
      if (game.game_over() || gameMode !== 'ai' || game.turn() === playerColor) return;
      const moves = game.moves({ verbose: true });
      if (moves.length === 0) return;

      const aiColor = game.turn();
      let chosen = null;

      if (aiDifficulty === 'easy') {
        // Easy: Mostly random, occasionally grabs a capture
        const captures = moves.filter(m => m.captured);
        if (captures.length > 0 && Math.random() < 0.4) {
          chosen = captures[Math.floor(Math.random() * captures.length)];
        } else {
          chosen = moves[Math.floor(Math.random() * moves.length)];
        }
      } else if (aiDifficulty === 'medium') {
        // Medium: 1-ply greedy evaluation + center control
        let bestScore = -Infinity;
        moves.forEach(m => {
          game.move(m);
          const s = evaluateBoard(aiColor) + (Math.random() * 3 - 1.5);
          game.undo();
          if (s > bestScore) { bestScore = s; chosen = m; }
        });
      } else {
        // Hard: 2-ply Minimax lookahead (anticipates player's best counter-move!)
        let bestScore = -Infinity;
        moves.forEach(m => {
          game.move(m);
          const oppMoves = game.moves({ verbose: true });
          let worstReplyScore = Infinity;
          if (oppMoves.length === 0) {
            worstReplyScore = game.in_checkmate() ? 9999 : 0;
          } else {
            for (let i = 0; i < oppMoves.length; i++) {
              game.move(oppMoves[i]);
              const evalScore = evaluateBoard(aiColor);
              game.undo();
              if (evalScore < worstReplyScore) worstReplyScore = evalScore;
            }
          }
          game.undo();
          const finalScore = worstReplyScore + (Math.random() * 1.5);
          if (finalScore > bestScore) { bestScore = finalScore; chosen = m; }
        });
      }

      if (!chosen) chosen = moves[0];
      executeMove(chosen.from, chosen.to);
    }

    function updateTurnUI() {
      const badge = document.getElementById('turn-badge');
      const turn = game.turn();

      if (game.in_checkmate()) {
        playCartoonSFX('win');
        if (gameMode === '2p') {
          badge.innerText = turn === 'w' ? '🏆 Neon Wins!' : '🏆 Mint Wins!';
        } else {
          badge.innerText = turn === playerColor ? '💀 AI Wins!' : '🏆 You Win!';
        }
        showComicPopup('CHECKMATE!');
      } else if (game.in_draw()) {
        badge.innerText = '🤝 Draw Game!';
      } else if (game.in_check()) {
        playCartoonSFX('check');
        badge.innerText = '⚠️ CHECK!';
        showComicPopup('CHECK!');
      } else {
        if (gameMode === '2p') {
          badge.innerText = turn === 'w' ? '🟢 Mint Turn (P1)' : '🌸 Neon Turn (P2)';
        } else {
          const isPlayer = turn === playerColor;
          const pText = playerColor === 'w' ? '🟢 Your Turn (Mint)' : '🌸 Your Turn (Neon)';
          const aiText = playerColor === 'w' ? '🌸 AI Thinking...' : '🟢 AI Thinking...';
          badge.innerText = isPlayer ? pText : aiText;
        }
      }
    }

    // --- 6. GLITCH-FREE TAP VS DRAG DETECTION ---
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let downX = 0, downY = 0;

    window.addEventListener('pointerdown', (e) => {
      downX = e.clientX;
      downY = e.clientY;
      desiredCamPos = null; // Stop auto-camera glide if user grabs the camera manually
    });

    window.addEventListener('pointerup', (e) => {
      const modalOpen = document.getElementById('team-modal').style.display !== 'none';
      const canControlCurrentTurn = (gameMode === '2p') || (game.turn() === playerColor);
      if (modalOpen || isAnimating || !canControlCurrentTurn || e.target.tagName === 'BUTTON') return;

      const moveDist = Math.hypot(e.clientX - downX, e.clientY - downY);
      if (moveDist > 7) return;

      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      const pieceRoots = Object.values(pieceMeshes);
      const allTargets = [...highlightMeshes, ...pieceRoots, ...interactables];
      const hits = raycaster.intersectObjects(allTargets, true);

      if (hits.length > 0) {
        let clickedSq = hits[0].object.userData.square;
        if (!clickedSq && hits[0].object.parent) {
          clickedSq = hits[0].object.parent.userData.square;
        }
        if (!clickedSq) return;

        // 1. Move to valid destination square
        if (selectedSquare) {
          const isValid = game.moves({ square: selectedSquare, verbose: true }).some(m => m.to === clickedSq);
          if (isValid) {
            executeMove(selectedSquare, clickedSq);
            return;
          }
        }

        // 2. Select active turn's piece
        const piece = game.get(clickedSq);
        if (piece && piece.color === game.turn()) {
          if (selectedSquare === clickedSq) {
            clearSelectionAndHighlights();
          } else {
            selectPieceOnSquare(clickedSq);
          }
        } else {
          clearSelectionAndHighlights();
        }
      } else {
        clearSelectionAndHighlights();
      }
    });

    // --- 7. UI BUTTONS ---
    document.getElementById('cam-btn').addEventListener('click', () => {
      isTopDown = !isTopDown;
      const activeSide = gameMode === '2p' ? game.turn() : playerColor;
      positionCameraForSide(activeSide, true);
    });

    document.getElementById('sfx-btn').addEventListener('click', (e) => {
      sfxEnabled = !sfxEnabled;
      e.target.innerText = sfxEnabled ? '🔊 SFX' : '🔇 Mute';
      e.target.style.background = sfxEnabled ? '#a8dadc' : '#ddd';
      if (sfxEnabled) playCartoonSFX('select');
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      document.getElementById('team-modal').style.display = 'flex';
    });

    // --- 8. RENDER & ANIMATION LOOP ---
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();

      // Smooth camera transition (for 2P Pass & Play or 2D/3D toggle)
      if (desiredCamPos) {
        camera.position.lerp(desiredCamPos, dt * 5);
        if (camera.position.distanceTo(desiredCamPos) < 0.08) {
          camera.position.copy(desiredCamPos);
          desiredCamPos = null;
        }
      }

      if (selectedSquare && pieceMeshes[selectedSquare] && !isAnimating) {
        const m = pieceMeshes[selectedSquare];
        m.position.y = 0.45 + Math.sin(elapsed * 8) * 0.1;
        m.rotation.y = Math.sin(elapsed * 5) * 0.18;
      }

      highlightMeshes.forEach(disc => {
        const s = 1 + Math.sin(elapsed * 7) * 0.14;
        disc.scale.set(s, 1, s);
      });

      for (let i = activeJumpers.length - 1; i >= 0; i--) {
        const j = activeJumpers[i];
        j.progress += dt * 3.0;
        const t = Math.min(j.progress, 1);

        j.mesh.position.lerpVectors(j.startPos, j.endPos, t);
        j.mesh.position.y = 0.12 + Math.sin(t * Math.PI) * 1.8;

        const stretch = 1 + Math.sin(t * Math.PI) * 0.24;
        j.mesh.scale.set(1 / Math.sqrt(stretch), stretch, 1 / Math.sqrt(stretch));

        if (t > 0.72 && j.capturedMesh && !j.hasTriggeredCapture) {
          j.hasTriggeredCapture = true;
          playCartoonSFX('pow');
          const words = ['POW!', 'BAM!', 'BONK!', 'SMASH!'];
          showComicPopup(words[Math.floor(Math.random() * words.length)]);
          spawnBurstParticles(j.endPos);
          flyingDebris.push({
            mesh: j.capturedMesh,
            vel: new THREE.Vector3((Math.random() - 0.5) * 7, 8.5, (Math.random() - 0.5) * 7),
            rot: new THREE.Vector3(10, 7, 9)
          });
        }

        if (t >= 1) {
          j.mesh.position.copy(j.endPos);
          j.mesh.scale.set(1, 1, 1);
          j.mesh.rotation.y = 0;
          activeJumpers.splice(i, 1);
          j.onComplete();
        }
      }

      for (let i = flyingDebris.length - 1; i >= 0; i--) {
        const d = flyingDebris[i];
        d.mesh.position.addScaledVector(d.vel, dt);
        d.vel.y -= 24 * dt;
        d.mesh.rotation.x += d.rot.x * dt;
        d.mesh.rotation.z += d.rot.z * dt;
        if (d.mesh.position.y < -10) {
          scene.remove(d.mesh);
          flyingDebris.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt * 1.8;
        p.mesh.position.addScaledVector(p.vel, dt);
        p.vel.y -= 15 * dt;
        p.mesh.scale.setScalar(Math.max(p.life, 0.01));
        if (p.life <= 0) {
          scene.remove(p.mesh);
          particles.splice(i, 1);
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
